<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWU Holonet Open - Home</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <!-- Header with navigation is injected by src/components.js -->
    <div style="display: flex; align-items: center; gap: 12px;">
      <h1 class="site-title">SWU Holonet Open</h1>
    </div>

    <!-- Admin actions -->
    <div id="admin-actions" style="margin-bottom: 28px;" hidden>
      <button onclick="window.location.href='admin-pairings.html'" class="generate-btn">Create New Pairings</button>
    </div>

    <!-- Generate pairings -->
    <div style="margin-bottom: 28px;">
      <button onclick="window.location.href='generator.html'" class="generate-btn" style="width: 100%; padding: 12px;">
        Generate your Own
      </button>
    </div>

    <!-- Saved pairings list -->
    <section class="saved-pairings-section">
      <h2 class="pairings-heading">Saved Pairings</h2>
      <div id="pairings-list" class="pairings-list">
        <p style="color: var(--muted);">Loading pairings...</p>
      </div>
    </section>

  </main>

  <script src="src/auth.js" defer></script>
  <script src="src/components.js" defer></script>
  <script src="src/nav.js" defer></script>
  <script src="src/display.js" defer></script>
  <script src="src/home.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.SWU?.Components?.injectHeader();
    });
  </script>
</body>
</html>
