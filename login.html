<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SWU Holonet Open</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="src/forms.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card-header">
        <h1 class="auth-card-title">Login</h1>
      </div>

      <form id="login-form" class="auth-form-container">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input id="username" type="text" class="form-input" required />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input id="password" type="password" class="form-input" required />
        </div>

        <button type="submit" class="submit-btn auth-submit">Login</button>
        <p id="login-error" class="auth-message error-message" hidden></p>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register</a>
      </div>
    </div>
  </div>

  <script src="src/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      try {
        // Redirect if already authenticated
        if (window.SWU?.Auth?.isAuthenticated?.()) {
          window.location.href = 'index.html';
          return;
        }

        const form = document.getElementById('login-form');
        const errorEl = document.getElementById('login-error');
        const submitBtn = form.querySelector('.submit-btn');
        
        if (!form) {
          return;
        }

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          
          try {
            errorEl.hidden = true;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
              throw new Error('Username and password required');
            }

            const response = await window.SWU.Auth.authFetch('/api/auth/login', {
              method: 'POST',
              body: JSON.stringify({ username, password }),
            });

            const data = await response.json();
            
            if (!response.ok) {
              throw new Error(data.message || 'Login failed');
            }

            const token = data.token || data.accessToken;
            if (!token) throw new Error('No token in response');

            window.SWU.Auth.setAuthToken(token, data.username || username);
            window.location.href = 'index.html';
          } catch (err) {
            errorEl.textContent = err.message;
            errorEl.hidden = false;
            submitBtn.disabled = false;
            submitBtn.textContent = 'Login';
          }
        });
      } catch (err) {
        // Silent fail
      }
    });
  </script>
</body>
</html>
