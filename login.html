<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SWU Holonet Open</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container auth-container">
    <div style="display: flex; align-items: center; gap: 12px;">
      <h1>Login</h1>
      <span id="auth-status" style="font-size: 0.85em; color: var(--muted);">logged off</span>
    </div>
    <form id="login-form" class="auth-form">
      <label for="username">Username</label>
      <input id="username" type="text" required />

      <label for="password">Password</label>
      <input id="password" type="password" required />

      <button type="submit" class="generate-btn">Login</button>
      <p id="login-error" class="error-message" hidden></p>
      <p class="auth-note">Don't have an account? <a href="register.html">Register</a></p>
    </form>
  </main>

  <script src="src/auth.js"></script>
  <script>
    console.log('[LoginPage] Inline script started');
    
    document.addEventListener('DOMContentLoaded', () => {
      console.log('[LoginPage] DOMContentLoaded');
      
      try {
        // Redirect if already authenticated
        if (window.SWU?.Auth?.isAuthenticated?.()) {
          console.log('[LoginPage] Already authenticated, redirecting');
          window.location.href = 'index.html';
          return;
        }

        const form = document.getElementById('login-form');
        const errorEl = document.getElementById('login-error');
        
        if (!form) {
          console.error('[LoginPage] Form not found');
          return;
        }

        console.log('[LoginPage] Setting up form handler');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          console.log('[LoginPage] Form submitted');
          
          try {
            errorEl.hidden = true;
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
              throw new Error('Username and password required');
            }

            console.log('[LoginPage] Calling authFetch', { username });
            const response = await window.SWU.Auth.authFetch('/api/auth/login', {
              method: 'POST',
              body: JSON.stringify({ username, password }),
            });

            const data = await response.json();
            console.log('[LoginPage] Response received', { status: response.status });
            
            if (!response.ok) {
              throw new Error(data.message || 'Login failed');
            }

            const token = data.token || data.accessToken;
            if (!token) throw new Error('No token in response');

            console.log('[LoginPage] Token received, saving auth');
            window.SWU.Auth.setAuthToken(token, data.username || username);
            
            console.log('[LoginPage] Redirecting to admin.html');
            window.location.href = 'admin.html';
          } catch (err) {
            console.error('[LoginPage] Error:', err.message);
            errorEl.textContent = err.message;
            errorEl.hidden = false;
          }
        });
        console.log('[LoginPage] Form handler attached');
      } catch (err) {
        console.error('[LoginPage] Fatal error:', err);
      }
    });
  </script>
</body>
</html>
