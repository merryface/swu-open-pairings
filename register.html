<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SWU Holonet Open</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="src/forms.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card-header">
        <h1 class="auth-card-title">Register</h1>
      </div>

      <form id="register-form" class="auth-form-container">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input id="username" type="text" class="form-input" required />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input id="password" type="password" class="form-input" required minlength="8" />
          <span class="password-hint">Minimum 8 characters</span>
        </div>

        <div class="form-group">
          <label for="special-word" class="form-label">Approval Word</label>
          <input id="special-word" type="password" class="form-input" required placeholder="Provided by merryface" />
          <span class="password-hint">Secret code from admin approval</span>
        </div>

        <button type="submit" class="submit-btn auth-submit">Register</button>
        <p id="register-error" class="message error-message" hidden></p>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>
  </div>

  <script src="src/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      try {
        // Redirect if already authenticated
        if (window.SWU?.Auth?.isAuthenticated?.()) {
          window.location.href = 'index.html';
          return;
        }

        const form = document.getElementById('register-form');
        const errorEl = document.getElementById('register-error');
        const submitBtn = form.querySelector('.submit-btn');
        
        if (!form) {
          return;
        }

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          
          try {
            errorEl.hidden = true;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Registering...';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const specialWord = document.getElementById('special-word').value;
            
            if (!username || !password || !specialWord) {
              throw new Error('Username, password, and approval word are required');
            }

            if (password.length < 8) {
              throw new Error('Password must be at least 8 characters');
            }

            const response = await window.SWU.Auth.authFetch('/api/auth/register', {
              method: 'POST',
              body: JSON.stringify({ username, password, special_word: specialWord }),
            });

            const data = await response.json();
            
            if (!response.ok) {
              throw new Error(data.message || 'Registration failed');
            }

            window.location.href = 'login.html';
          } catch (err) {
            errorEl.textContent = err.message;
            errorEl.hidden = false;
            submitBtn.disabled = false;
            submitBtn.textContent = 'Register';
          }
        });
      } catch (err) {
        // Silent fail
      }
    });
  </script>
</body>
</html>
